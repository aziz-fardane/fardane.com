<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-label="لوحة نموذجية: خريطة تخطيطية لشبكة سقاية">
  <defs>
    <pattern id="field" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#a67a2e" stroke-width="1" opacity=".45"/>
    </pattern>
    <pattern id="grove" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.8" fill="#2e6f68" opacity=".5"/>
      <circle cx="14" cy="13" r="1.4" fill="#2e6f68" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1400" height="1000" fill="#f7f1df"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#b08a4a" stroke-width="1.5" opacity=".7"/>
  <rect x="40" y="40" width="1320" height="920" fill="none" stroke="#b08a4a" stroke-width=".6" opacity=".45"/>

  <!-- title cartouche -->
  <g>
    <rect x="1060" y="78" width="252" height="96" fill="#f7f1df" stroke="#b08a4a" stroke-width="1.2" opacity=".9"/>
    <g stroke="#8a6122" stroke-width="2" stroke-linecap="round" opacity=".55">
      <line x1="1284" y1="108" x2="1092" y2="108"/>
      <line x1="1284" y1="128" x2="1148" y2="128"/>
    </g>
    <g stroke="#6f6a5c" stroke-width="1.1" stroke-linecap="round" opacity=".4">
      <line x1="1284" y1="148" x2="1160" y2="148"/>
    </g>
  </g>

  <!-- relief hachures, north-east -->
  <g stroke="#2a241c" stroke-width=".8" opacity=".22">
    <path d="M120 120 q 60 40 120 10 q 70 -34 130 18"/>
    <path d="M140 160 q 60 40 120 10 q 70 -34 130 18"/>
    <path d="M160 200 q 60 40 120 10 q 70 -34 130 18"/>
    <path d="M180 240 q 60 40 120 10 q 70 -34 130 18"/>
  </g>

  <!-- river -->
  <path d="M60 640 C 240 600, 360 720, 520 690 S 820 610, 980 660 S 1220 760, 1340 720"
        fill="none" stroke="#2e6f68" stroke-width="5" opacity=".6" stroke-linecap="round"/>
  <path d="M60 640 C 240 600, 360 720, 520 690 S 820 610, 980 660 S 1220 760, 1340 720"
        fill="none" stroke="#2e6f68" stroke-width="1.2" opacity=".35" stroke-dasharray="1 9"/>

  <!-- canal branches -->
  <g fill="none" stroke="#2e6f68" stroke-width="2" opacity=".5" stroke-linecap="round">
    <path d="M420 700 q -10 -80 40 -140 t 30 -150"/>
    <path d="M700 660 q 20 -70 90 -110 t 60 -120"/>
    <path d="M980 680 q -30 -70 -20 -140 t 50 -120"/>
    <path d="M560 690 q 40 60 120 70 t 110 40"/>
  </g>

  <!-- irrigated fields -->
  <g stroke="#a67a2e" stroke-width="1" opacity=".6">
    <rect x="452" y="360" width="150" height="104" fill="url(#field)"/>
    <rect x="616" y="380" width="112" height="86" fill="url(#field)"/>
    <rect x="742" y="330" width="140" height="96" fill="url(#field)"/>
    <rect x="900" y="360" width="120" height="92" fill="url(#field)"/>
    <rect x="1024" y="392" width="150" height="100" fill="url(#field)"/>
  </g>

  <!-- groves -->
  <g stroke="#2e6f68" stroke-width=".8" opacity=".55">
    <rect x="300" y="760" width="170" height="90" fill="url(#grove)"/>
    <rect x="1080" y="740" width="180" height="96" fill="url(#grove)"/>
  </g>

  <!-- qanat: wells along a line -->
  <g stroke="#8a6122" stroke-width="1.6" opacity=".7">
    <path d="M240 470 L 520 640" stroke-dasharray="6 6"/>
  </g>
  <g fill="#f7f1df" stroke="#8a6122" stroke-width="1.4" opacity=".8">
    <circle cx="280" cy="492" r="7"/>
    <circle cx="340" cy="522" r="7"/>
    <circle cx="400" cy="552" r="7"/>
    <circle cx="460" cy="582" r="7"/>
    <circle cx="516" cy="612" r="7"/>
  </g>

  <!-- settlement -->
  <g fill="none" stroke="#2a241c" stroke-width="1.3" opacity=".55">
    <rect x="1060" y="560" width="26" height="26"/>
    <rect x="1094" y="560" width="18" height="18"/>
    <rect x="1094" y="586" width="18" height="18"/>
    <rect x="1060" y="594" width="26" height="18"/>
    <rect x="1120" y="570" width="14" height="34"/>
  </g>

  <!-- north arrow -->
  <g transform="translate(1240 820)" fill="none" stroke="#2a241c" stroke-width="1.2" opacity=".6">
    <circle r="34"/>
    <path d="M0 -26 L 9 10 L 0 4 L -9 10 Z" fill="#a67a2e" stroke="none" opacity=".7"/>
    <text x="0" y="-42" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2a241c" stroke="none" opacity=".7">N</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(90 880)">
    <g stroke="#2a241c" stroke-width="1.2" opacity=".6">
      <line x1="0" y1="0" x2="300" y2="0"/>
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="75" y1="-5" x2="75" y2="5"/>
      <line x1="150" y1="-7" x2="150" y2="7"/>
      <line x1="225" y1="-5" x2="225" y2="5"/>
      <line x1="300" y1="-7" x2="300" y2="7"/>
    </g>
    <rect x="0" y="-3" width="75" height="6" fill="#2a241c" opacity=".45" stroke="none"/>
    <rect x="150" y="-3" width="75" height="6" fill="#2a241c" opacity=".45" stroke="none"/>
    <g font-family="Georgia, serif" font-size="13" fill="#6f6a5c" opacity=".65" text-anchor="middle">
      <text x="0" y="26">0</text>
      <text x="150" y="26">5</text>
      <text x="300" y="26">10</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(1060 120)">
    <g stroke="#6f6a5c" stroke-width="1" opacity=".55">
      <line x1="0" y1="0" x2="252" y2="0"/>
      <line x1="0" y1="112" x2="252" y2="112"/>
    </g>
  </g>
  <g transform="translate(1080 160)" opacity=".7">
    <path d="M0 0 L 34 0" stroke="#2e6f68" stroke-width="3"/>
    <path d="M0 34 L 34 34" stroke="#8a6122" stroke-width="1.4" stroke-dasharray="5 5"/>
    <rect x="0" y="62" width="34" height="16" fill="url(#field)" stroke="#a67a2e" stroke-width="1"/>
  </g>
  <g stroke="#6f6a5c" stroke-width="1.4" stroke-linecap="round" opacity=".45">
    <line x1="1300" y1="160" x2="1160" y2="160"/>
    <line x1="1300" y1="194" x2="1160" y2="194"/>
    <line x1="1300" y1="230" x2="1200" y2="230"/>
  </g>
</svg>
