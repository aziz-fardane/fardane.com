<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-label="لوحة نموذجية: صفحة ختام المخطوط بخاتم ناشر">
  <rect width="900" height="1300" fill="#f7f1df"/>
  <rect x="34" y="34" width="832" height="1232" fill="none" stroke="#b08a4a" stroke-width="1.4" opacity=".7"/>
  <rect x="46" y="46" width="808" height="1208" fill="none" stroke="#b08a4a" stroke-width=".6" opacity=".45"/>

  <!-- final lines, tapering to a point -->
  <g stroke="#2a241c" stroke-width="1.7" stroke-linecap="butt" opacity=".5">
    <line x1="826" y1="140" x2="128" y2="140"/>
    <line x1="826" y1="174" x2="128" y2="174"/>
    <line x1="826" y1="208" x2="214" y2="208"/>
    <line x1="826" y1="242" x2="128" y2="242"/>
    <line x1="826" y1="276" x2="336" y2="276"/>
    <line x1="826" y1="310" x2="128" y2="310"/>
    <line x1="826" y1="344" x2="128" y2="344"/>
    <line x1="826" y1="378" x2="470" y2="378"/>
  </g>

  <!-- colophon block -->
  <g stroke="#a67a2e" stroke-width="1.4" stroke-linecap="round" opacity=".5">
    <line x1="826" y1="470" x2="128" y2="470"/>
  </g>
  <g stroke="#8a6122" stroke-width="1.5" stroke-linecap="round" opacity=".42">
    <line x1="826" y1="520" x2="286" y2="520"/>
    <line x1="826" y1="552" x2="128" y2="552"/>
    <line x1="826" y1="584" x2="356" y2="584"/>
  </g>
  <g stroke="#6f6a5c" stroke-width="1.1" stroke-linecap="round" opacity=".38">
    <line x1="826" y1="626" x2="404" y2="626"/>
    <line x1="826" y1="652" x2="470" y2="652"/>
  </g>

  <!-- seal: eight-point khatam -->
  <g transform="translate(470 900)" fill="none" stroke="#a04a2e" stroke-width="2" opacity=".55">
    <circle r="104"/>
    <circle r="96" stroke-width=".8" opacity=".7"/>
    <rect x="-62" y="-62" width="124" height="124"/>
    <rect x="-62" y="-62" width="124" height="124" transform="rotate(45)"/>
    <circle r="30" stroke-width="1.2"/>
    <g stroke-width=".9" opacity=".7">
      <line x1="-104" y1="0" x2="104" y2="0"/>
      <line x1="0" y1="-104" x2="0" y2="104"/>
    </g>
  </g>

  <!-- register marks -->
  <g stroke="#6f6a5c" stroke-width="1" opacity=".3">
    <line x1="128" y1="1120" x2="212" y2="1120"/>
    <line x1="128" y1="1132" x2="180" y2="1132"/>
  </g>

  <text x="450" y="1218" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#6f6a5c" opacity=".55">٣</text>
</svg>
