<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="لوحة نموذجية: وثيقة بخطوط قليلة وخاتم وشهود">
  <rect width="1200" height="900" fill="#f7f1df"/>
  <rect x="30" y="30" width="1140" height="840" fill="none" stroke="#b08a4a" stroke-width="1.4" opacity=".7"/>
  <rect x="42" y="42" width="1116" height="816" fill="none" stroke="#b08a4a" stroke-width=".6" opacity=".4"/>

  <!-- fold -->
  <line x1="600" y1="42" x2="600" y2="858" stroke="#6f6a5c" stroke-width=".8" stroke-dasharray="4 10" opacity=".22"/>

  <!-- invocation line, centred -->
  <g stroke="#a67a2e" stroke-width="2.2" stroke-linecap="round" opacity=".55">
    <line x1="720" y1="120" x2="480" y2="120"/>
  </g>

  <!-- body: few long lines, wide margins -->
  <g stroke="#2a241c" stroke-width="1.7" stroke-linecap="butt" opacity=".5">
    <line x1="1060" y1="200" x2="200" y2="200"/>
    <line x1="1060" y1="244" x2="200" y2="244"/>
    <line x1="1060" y1="288" x2="200" y2="288"/>
    <line x1="1060" y1="332" x2="200" y2="332"/>
    <line x1="1060" y1="376" x2="316" y2="376"/>
    <line x1="1060" y1="420" x2="200" y2="420"/>
    <line x1="1060" y1="464" x2="200" y2="464"/>
    <line x1="1060" y1="508" x2="200" y2="508"/>
    <line x1="1060" y1="552" x2="248" y2="552"/>
  </g>

  <!-- witness marks -->
  <g opacity=".55">
    <g stroke="#2a241c" stroke-width="1.3" stroke-linecap="round">
      <line x1="1060" y1="660" x2="900" y2="660"/>
      <line x1="1060" y1="700" x2="940" y2="700"/>
      <line x1="1060" y1="740" x2="900" y2="740"/>
    </g>
    <g fill="#a67a2e">
      <circle cx="880" cy="660" r="3"/>
      <circle cx="920" cy="700" r="3"/>
      <circle cx="880" cy="740" r="3"/>
    </g>
  </g>

  <!-- seal -->
  <g transform="translate(300 690)" fill="none" stroke="#a04a2e" stroke-width="2" opacity=".55">
    <circle r="76"/>
    <circle r="68" stroke-width=".8" opacity=".7"/>
    <rect x="-44" y="-44" width="88" height="88"/>
    <rect x="-44" y="-44" width="88" height="88" transform="rotate(45)"/>
    <circle r="20" stroke-width="1.1"/>
  </g>
</svg>
