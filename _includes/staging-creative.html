{% comment %}
    staging-only creative layer: courtyard cover, arcade navigation and a
    majlis-like reader surface. CSS only — no external fonts, images, APIs,
    hidden articles or edits to original Arabic text.
{% endcomment %}
<style data-creative="courtyard">
  /* 1) الرئيسية كفناء: أروقة علوية وسفلية وحوض ماء مركزي، خفيف جداً خلف المحتوى. */
  @media screen {
    body.home-page .hc::after{
      content:"";position:absolute;inset:9% 6%;z-index:1;pointer-events:none;
      border:1px solid var(--line-strong);
      background:
        radial-gradient(circle at 50% 50%,var(--water) 0 15px,transparent 16px),
        radial-gradient(circle at 50% 0%,transparent 0 26px,var(--brass) 27px 29px,transparent 30px) 0 0/116px 100% repeat-x,
        radial-gradient(circle at 50% 100%,transparent 0 26px,var(--brass) 27px 29px,transparent 30px) 0 0/116px 100% repeat-x;
      opacity:.15;
    }
    body.home-page .hc-spine{
      background:linear-gradient(180deg,var(--paper-2),var(--paper));
      box-shadow:inset -2px 0 0 var(--brass-2);
    }

    /* 2) التنقل كأروقة: قوس صغير فوق كل رابط، والرابط الحالي يضيء. */
    header.site-header .site-nav .site-nav-link{position:relative;padding-top:9px}
    header.site-header .site-nav .site-nav-link::before{
      content:"";position:absolute;top:0;right:50%;transform:translateX(50%);
      width:26px;height:11px;border:1px solid var(--brass);border-bottom:0;
      border-radius:13px 13px 0 0 / 9px 9px 0 0;opacity:.55;transition:opacity .2s ease;
    }
    header.site-header .site-nav .site-nav-link:hover::before,
    header.site-header .site-nav .site-nav-link[aria-current="page"]::before{opacity:1;border-color:var(--water)}

    /* 3) وضع القارئ كمجلس: حاشية رفيعة وظل إطار بدل سطح مسطّح. */
    .rd-ui{box-shadow:inset 0 0 0 1px var(--rdl)}
    .rd-ui .rd-tools{border-bottom:1px solid var(--rdl);padding-bottom:.5rem}
    .rd-ui .rd-tool{border-radius:999px}

    /* 4) الخط الزمني كمسار ماء بدل خط مستقيم عادي. */
    .tl{border-inline-start:2px solid var(--water)}

    /* 5) الأكورديون: إيقاع أقواس صغيرة في الهوامش دون لمس التخطيط. */
    .ar-list.sw-accordion .ar-thumb::before{background-blend-mode:soft-light}
  }
  @media screen and (prefers-reduced-motion:reduce){
    header.site-header .site-nav .site-nav-link::before{transition:none}
  }
  @media print{
    body.home-page .hc::after,
    header.site-header .site-nav .site-nav-link::before{display:none}
  }
</style>
