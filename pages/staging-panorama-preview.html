<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAGING — بانوراما متحركة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&amp;display=swap">
<style>
:root{--color-plaster:#f4f1e9;--color-paper:#faf8f2;--color-ink:#14201c;--color-brass-text:#8f6524;--color-brass:#a67a2e;--color-water:#2e6f68;--color-line:#ded7c5;--color-muted:#6f6a5c}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-plaster);color:var(--color-ink);font-family:system-ui,"Segoe UI",sans-serif;min-height:100vh}
html[data-night="on"]{color-scheme:dark;--color-plaster:#0b1c17;--color-paper:#12281f;--color-ink:#f3f0e7;--color-brass-text:#e2c98f;--color-brass:#c9a35f;--color-water:#4f938b;--color-line:#2f4a3f;--color-muted:#a6b0a4;background:#0b1c17;color:#f3f0e7}
.demo-banner{position:relative;z-index:60;background:#7c2d12;color:#fff;text-align:center;font-size:12px;padding:6px 12px;font-family:monospace;letter-spacing:.05em}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px 120px}
header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--color-line);padding:10px 0 16px}
.mark{font-size:18px;font-weight:700;color:var(--color-brass-text)}
.site-nav{display:flex;gap:18px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.site-nav-link{position:relative;display:inline-block;padding:4px 0;color:var(--color-ink);text-decoration:none;font-size:14px}
.site-nav-rule{position:absolute;right:0;bottom:0;width:0;height:2px;background:var(--color-brass);transition:width .18s ease}
.site-nav-link:hover .site-nav-rule{width:100%}
.site-nav-link[aria-current="page"] span{color:var(--color-brass-text)}
.site-nav-link[aria-current="page"] .site-nav-rule{width:100%}
h1{font-size:26px;margin:26px 0 8px}
.lead{color:var(--color-muted);line-height:1.8;max-width:62ch}
.card{background:var(--color-paper);border:1px solid var(--color-line);border-radius:10px;padding:18px;margin:22px 0}
.hint{font-size:12px;color:var(--color-muted);margin-top:14px}
.demo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.demo-btn{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--color-line);border-radius:6px;background:var(--color-paper);color:var(--color-ink);cursor:pointer}
.ar-lang a[hreflang="en"]{display:inline-flex;align-items:center;padding:.15em .6em;border:1px solid #a67a2e;border-radius:999px;background:#fbf7ee;color:#8f6524;font-size:.72rem;line-height:1.7;letter-spacing:.08em;text-decoration:none}
html[data-night="on"] .ar-lang a[hreflang="en"]{background:#12281f;border-color:#c9a35f;color:#e2c98f}
@media(max-width:520px){.wrap{padding:20px 12px 110px}h1{font-size:22px}.site-nav{gap:12px}}

/* Option 2 — الكوفي المعاصر: one Reem Kufi voice for every page name,
   weight 500, quiet spacing, the identity's own ink colour and the existing
   thin brass rule under the navigation. Colours, layout, Arabic text and
   background are untouched. */
body[data-gemini] .mark,
body[data-gemini] .site-nav-link,
body[data-gemini] h1{
  font-family:"Reem Kufi","Segoe UI",Tahoma,sans-serif;
  font-weight:500;
  letter-spacing:0;
  text-rendering:optimizeLegibility;
}
body[data-gemini] .mark{font-size:18px;line-height:1.5;word-spacing:.06em}
body[data-gemini] .site-nav-link{font-size:14px;word-spacing:.1em}
body[data-gemini] h1{font-size:28px;line-height:1.5;word-spacing:.06em}
@media (max-width:520px){
  body[data-gemini] .mark{font-size:17px;word-spacing:.04em}
  body[data-gemini] .site-nav-link{font-size:13px;word-spacing:.08em}
  body[data-gemini] h1{font-size:24px;line-height:1.45;word-spacing:.04em}
}

/* Keep the identity's own text colours — ink / brass / muted — because the
   local photo is mid-light. A faint paper halo gives contrast without
   repainting the text, changing the layout, or touching the opaque card.
   Night mode keeps its own light palette and uses a dark halo instead. */
body[data-gemini] .mark,
body[data-gemini] .site-nav-link,
body[data-gemini] h1,
body[data-gemini] .lead,
body[data-gemini] .hint{
  text-shadow:0 1px 0 rgba(250,248,242,.72),0 0 6px rgba(250,248,242,.45);
}
html[data-night="on"] body[data-gemini] .mark,
html[data-night="on"] body[data-gemini] .site-nav-link,
html[data-night="on"] body[data-gemini] h1,
html[data-night="on"] body[data-gemini] .lead,
html[data-night="on"] body[data-gemini] .hint{
  text-shadow:0 1px 0 rgba(11,28,23,.85),0 0 6px rgba(11,28,23,.55);
}

/* existing Gemini background, as in staging */
body[data-gemini="home"]{background-image:linear-gradient(rgba(20,25,22,.16),rgba(20,25,22,.16)),url('/staging-assets/01-home.jpg') !important}
body[data-gemini]{background-position:center !important;background-repeat:no-repeat !important;background-attachment:fixed !important}

/* proposed staging-only panoramic drift (GPU transform, no repaint) */
body[data-gemini]{--pano:url('/staging-assets/01-home.jpg');isolation:isolate}
@keyframes fardane-panorama-slide{from{transform:translate3d(-2%,0,0) scale(1.06)}to{transform:translate3d(2%,0,0) scale(1.06)}}
body[data-gemini]::before{
  content:"";position:fixed;inset:-6% -8%;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(20,25,22,.16),rgba(20,25,22,.16)),var(--pano);
  background-size:cover;background-position:center;background-repeat:no-repeat;
  animation:fardane-panorama-slide 54s ease-in-out infinite alternate;will-change:transform;
}
@media (prefers-reduced-motion:reduce){body[data-gemini]::before{animation:none;transform:none}}
/* Staging preview keeps the panorama in motion under reduced-motion. */
body[data-gemini]::before{animation:fardane-panorama-slide 12s ease-in-out infinite alternate}

/* water ambience: small glossy raindrops, a thin rill, faint ripples/reflections.
   Additive only: behind content, no layout, palette token, image or text change. */
.fardane-water-field{
  position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;contain:strict;
  --wf-core:rgba(250,248,242,.26);
  --wf-edge:rgba(46,111,104,.15);
  --wf-warm:rgba(226,201,143,.15);
  --wf-line:rgba(46,111,104,.20);
  --wf-line-hi:rgba(166,217,208,.30);
  --wf-ripple:rgba(166,217,208,.10);
  --wf-glow:rgba(46,111,104,.13);
}
html[data-night="on"] .fardane-water-field{
  --wf-core:rgba(243,240,231,.24);
  --wf-edge:rgba(79,147,139,.20);
  --wf-warm:rgba(226,201,143,.18);
  --wf-line:rgba(79,147,139,.24);
  --wf-line-hi:rgba(166,217,208,.32);
  --wf-ripple:rgba(166,217,208,.14);
  --wf-glow:rgba(79,147,139,.18);
}
@media (prefers-color-scheme:dark){
  html:not([data-night="off"]) .fardane-water-field{
    --wf-core:rgba(243,240,231,.24);
    --wf-edge:rgba(79,147,139,.20);
    --wf-warm:rgba(226,201,143,.18);
    --wf-line:rgba(79,147,139,.24);
    --wf-line-hi:rgba(166,217,208,.32);
    --wf-ripple:rgba(166,217,208,.14);
    --wf-glow:rgba(79,147,139,.18);
  }
}
/* Static masked frames; only the inner tiles move, so the fade never jumps. */
.wf-rain-a,.wf-rain-b{
  position:absolute;inset:-26% -8%;display:block;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18%,#000 82%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 18%,#000 82%,transparent 100%);
}
.wf-rain-a::before,.wf-rain-b::before{content:"";position:absolute;inset:0;display:block;background-repeat:repeat;will-change:transform}
/* Three drop sizes in one tile, each with a pale core for a soft glint. */
.wf-rain-a::before{
  background-image:
    radial-gradient(ellipse 1px 5px at 18% 14%,var(--wf-core),var(--wf-edge) 48%,transparent 74%),
    radial-gradient(ellipse 1.5px 8px at 62% 38%,var(--wf-core),var(--wf-edge) 46%,transparent 72%),
    radial-gradient(ellipse 2px 11px at 86% 72%,var(--wf-warm),var(--wf-edge) 50%,transparent 74%);
  background-size:132px 176px;
  opacity:.74;
  animation:wf-rain-fine 24s linear infinite;
}
/* Slower, deeper drops give quiet parallax. */
.wf-rain-b::before{
  background-image:
    radial-gradient(ellipse 1.5px 9px at 24% 26%,var(--wf-core),var(--wf-edge) 50%,transparent 76%),
    radial-gradient(ellipse 2px 13px at 74% 68%,var(--wf-warm),var(--wf-edge) 52%,transparent 76%);
  background-size:208px 264px;
  opacity:.58;
  animation:wf-rain-deep 46s linear infinite;
}
@keyframes wf-rain-fine{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,176px,0)}}
@keyframes wf-rain-deep{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,264px,0)}}
/* A narrow watercourse hugging the lower edge: no new band, just a hairline. */
.wf-rill{
  position:absolute;left:8%;right:8%;bottom:clamp(10px,3.5vh,34px);height:2px;display:block;
  background:linear-gradient(to right,transparent,var(--wf-line) 16%,var(--wf-line-hi) 50%,var(--wf-line) 84%,transparent);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);
  opacity:.72;
}
.wf-rill::before{content:"";position:absolute;left:0;right:0;bottom:-22px;height:48px;background:linear-gradient(to top,var(--wf-glow),transparent 72%);filter:blur(7px)}
.wf-rill::after{
  content:"";position:absolute;left:-30%;right:-30%;top:-1px;height:4px;
  background-image:radial-gradient(ellipse 28px 2px at 16% 50%,var(--wf-core),transparent 72%),radial-gradient(ellipse 20px 2px at 64% 50%,var(--wf-warm),transparent 72%);
  background-size:240px 4px;
  animation:wf-rill-glints 26s linear infinite;
  will-change:transform;
}
@keyframes wf-rill-glints{from{transform:translate3d(0,0,0)}to{transform:translate3d(240px,0,0)}}
/* Faint concentric ripples and reflections just above the rill. */
.wf-ripples{
  position:absolute;left:18%;right:18%;bottom:clamp(10px,3.5vh,34px);height:54px;display:block;
  background:repeating-radial-gradient(ellipse 150px 15px at 50% 100%,transparent 0 20px,var(--wf-ripple) 21px 22px,transparent 23px 38px);
  -webkit-mask-image:linear-gradient(to top,transparent,#000 34%,transparent 100%);
  mask-image:linear-gradient(to top,transparent,#000 34%,transparent 100%);
  transform-origin:50% 100%;opacity:.5;
  animation:wf-ripple-breathe 16s ease-in-out infinite alternate;
  will-change:transform,opacity;
}
.wf-ripples::before{
  content:"";position:absolute;left:0;right:0;bottom:0;height:26px;
  background-image:linear-gradient(to right,transparent,var(--wf-warm) 20%,transparent 38%,var(--wf-core) 62%,transparent 78%);
  opacity:.5;filter:blur(3px);
}
@keyframes wf-ripple-breathe{from{transform:scale(.98);opacity:.38}to{transform:scale(1.03);opacity:.62}}
@media (max-width:520px){
  .wf-rain-a::before{opacity:.5}
  .wf-rain-b::before{opacity:.36}
  .wf-rill{left:5%;right:5%;opacity:.6}
  .wf-ripples{left:12%;right:12%;height:40px;opacity:.4}
}
@media (prefers-reduced-motion:reduce){
  .wf-rain-a::before,.wf-rain-b::before,.wf-rill::after,.wf-ripples{animation:none}
  .wf-rain-a::before,.wf-rain-b::before{opacity:.34}
  .wf-rill::after{opacity:.4}
  .wf-ripples{opacity:.32;transform:none}
}
/* Staging preview keeps the water in motion under reduced-motion. */
.wf-rain-a::before{animation:wf-rain-fine 8s linear infinite;opacity:.74}
.wf-rain-b::before{animation:wf-rain-deep 14s linear infinite;opacity:.58}
.wf-rill::after{animation:wf-rill-glints 9s linear infinite}
.wf-ripples{animation:wf-ripple-breathe 6s ease-in-out infinite alternate}
@media print{.fardane-water-field{display:none!important}}
</style>
</head>
