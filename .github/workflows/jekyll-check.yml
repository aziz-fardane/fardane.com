name: Jekyll Check

# تشخيصي مؤقّت: يبني الموقع بـJekyll ويكتب سجل البناء في ملف داخل المستودع،
# لأن سجلات Actions لا تُقرأ بلا توثيق. يُشغَّل فقط برسالة فيها [ci-log].
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    if: contains(github.event.head_commit.message, '[ci-log]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build with Jekyll (capture log)
        env:
          JEKYLL_ENV: production
        run: |
          set +e
          {
            echo "=== ruby ==="
            ruby -v
            echo "=== bundle install ==="
            bundle install --jobs 4
            echo "install_exit=$?"
            echo "=== jekyll build ==="
            bundle exec jekyll build --trace
            echo "build_exit=$?"
          } > /tmp/jekyll.log 2>&1
          tail -c 30000 /tmp/jekyll.log > ci-jekyll.log
          echo "----- log -----"
          cat ci-jekyll.log
          exit 0

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-jekyll.log
          git commit -m "chore: jekyll build log [skip ci]" || echo "no changes"
          git push
