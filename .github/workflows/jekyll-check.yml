name: Jekyll Check

# بناء تشخيصي على فرع فقط (لا يمسّ main ولا النشر):
# يبني الموقع، ثم يحفظ نسخاً من الصفحات الناتجة + تقرير فحص في مجلد preview/
# لأن سجلات Actions لا تُقرأ بلا توثيق.
on:
  push:
    branches:
      - ci-jekyll

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install assets and build CSS/JS
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: |
          npm install
          npm run build

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          set +e
          rm -rf preview ci-jekyll.log
          {
            echo "=== bundle install ==="
            bundle install --jobs 4
            echo "install_exit=$?"
            echo "=== jekyll build ==="
            printf 'repository: aziz-fardane/fardane.com\nurl: "https://fardane.com"\nbaseurl: ""\n' > /tmp/_ci.yml
            printf 'newsletter_provider: "buttondown"\nnewsletter_user: "demo"\n' > /tmp/_ci_bt.yml
            bundle exec jekyll build --trace --config _config.yml,/tmp/_ci.yml
            echo "build_exit=$?"
            bundle exec jekyll build --trace --config _config.yml,/tmp/_ci.yml,/tmp/_ci_bt.yml --destination _site_bt
            echo "build_bt_exit=$?"
          } > /tmp/jekyll.log 2>&1
          tail -c 30000 /tmp/jekyll.log > ci-jekyll.log
          echo "----- log -----"
          cat ci-jekyll.log
          exit 0

      - name: Collect preview and checks
        run: |
          mkdir -p preview
          cp ci-jekyll.log preview/ci-jekyll.log
          for f in index.html services/index.html consultation/index.html manuscripts/index.html privacy-policy/index.html sitemap.xml; do
            if [ -f "_site/$f" ]; then
              cp "_site/$f" "preview/$(echo "$f" | tr '/' '_')"
            else
              echo "missing $f" >> preview/missing.txt
            fi
          done
          art=$(ls -d _site/articles/*/index.html 2>/dev/null | sort | head -1)
          if [ -n "$art" ]; then
            cp "$art" preview/article.html
            sed -n '/<form class="nl-form"/,/<\/form>/p' "$art" > preview/newsletter-form-formsubmit.html
            slug_dir=$(basename "$(dirname "$art")")
            if [ -f "_site_bt/articles/$slug_dir/index.html" ]; then
              sed -n '/<form class="nl-form"/,/<\/form>/p' "_site_bt/articles/$slug_dir/index.html" > preview/newsletter-form-buttondown.html
            fi
          fi
          {
            echo "html_files=$(find _site -name '*.html' | wc -l)"
            echo "liquid_leftover_files=$(grep -rl '{%' _site --include='*.html' 2>/dev/null | wc -l)"
            echo "articles_total=$(find _site/articles -name index.html 2>/dev/null | wc -l)"
            echo "articles_with_cta=$(grep -rl 'data-cta=\"consultation\"' _site/articles --include='*.html' 2>/dev/null | wc -l)"
            echo "services_proof_cards=$(grep -o 'data-cta=\"article-proof\"' _site/services/index.html 2>/dev/null | wc -l)"
            echo "consultation_proof_cards=$(grep -o 'data-cta=\"article-proof\"' _site/consultation/index.html 2>/dev/null | wc -l)"
            echo "manuscripts_robots=$(grep -o '<meta name=\"robots\"[^>]*>' _site/manuscripts/index.html 2>/dev/null | head -1)"
            echo "manuscripts_links_in_home=$(grep -c 'href=\"/manuscripts/\"' _site/index.html 2>/dev/null || true)"
            echo "manuscripts_in_sitemap=$(grep -c 'manuscripts' _site/sitemap.xml 2>/dev/null || true)"
            echo "newsletter_forms=$(grep -rl 'id=\"nl-form\"' _site --include='*.html' 2>/dev/null | wc -l)"
            echo "newsletter_provider=$(grep -o 'data-nl-provider=\"[^\"]*\"' _site/index.html 2>/dev/null | head -1)"
            echo "newsletter_tag_home=$(grep -o 'data-nl-tag=\"[^\"]*\"' _site/index.html 2>/dev/null | head -1)"
            echo "article_newsletter_tag=$(grep -o 'data-nl-tag="[^"]*"' preview/article.html 2>/dev/null | head -1)"
            echo "article_hidden_next=$(grep -o 'name="_next" value="[^"]*"' preview/newsletter-form-formsubmit.html 2>/dev/null | head -1)"
            echo "bt_build_exit=$(grep -o 'build_bt_exit=[0-9]*' ci-jekyll.log | head -1)"
            echo "bt_form_action=$(grep -o 'action="[^"]*"' preview/newsletter-form-buttondown.html 2>/dev/null | head -1)"
            echo "bt_tag_field=$(grep -o 'name="tag" value="[^"]*"' preview/newsletter-form-buttondown.html 2>/dev/null | head -1)"
            echo "bt_embed_field=$(grep -o 'name="embed" value="[^"]*"' preview/newsletter-form-buttondown.html 2>/dev/null | head -1)"
            echo "bt_formsubmit_fields=$(grep -c '_next' preview/newsletter-form-buttondown.html 2>/dev/null || true)"
            echo "preview_in_sitemap=$(grep -c 'preview/' _site/sitemap.xml 2>/dev/null || true)"
            echo "newsletter_policy_link=$(grep -c 'href=\"/privacy-policy/\"' _site/index.html 2>/dev/null || true)"
            echo "analytics_events=$(grep -o 'newsletter_submit\|outbound_click\|cta_click' _site/index.html 2>/dev/null | sort -u | tr '\n' ' ')"
            echo "privacy_provider_line=$(grep -c 'Buttondown' _site/privacy-policy/index.html 2>/dev/null || true)"
            echo "cta_titles:"
            for f in $(find _site/articles -name index.html 2>/dev/null | sort); do
              t=$(grep -o 'class="ed-cta-title">[^<]*' "$f" | head -1 | sed 's/.*>//')
              echo "  $(basename "$(dirname "$f")") => $t"
            done
          } > preview/verify.txt
          echo "----- verify -----"
          cat preview/verify.txt

      - name: Build self-contained visual previews
        run: |
          python3 - <<'PY'
          import glob, pathlib, re
          css_files = sorted(glob.glob('_site/dist/main*.css'))
          css = pathlib.Path(css_files[0]).read_text(encoding='utf-8') if css_files else ''
          def inline(src, dst):
              p = pathlib.Path(src)
              if not p.exists():
                  return False
              html = p.read_text(encoding='utf-8', errors='ignore')
              html = re.sub(r'<link rel="stylesheet"[^>]*dist/main[^>]*>', '<style>' + css + '</style>', html)
              html = html.replace('src="/dist/', 'src="https://fardane.com/dist/')
              html = html.replace('href="/dist/', 'href="https://fardane.com/dist/')
              pathlib.Path(dst).write_text(html, encoding='utf-8')
              return True
          inline('_site/index.html', 'preview/home.html')
          hits = [p for p in glob.glob('_site/**/*.html', recursive=True)
                  if 'ar-archive-hero' in pathlib.Path(p).read_text(encoding='utf-8', errors='ignore')]
          for i, p in enumerate(hits[:2]):
              inline(p, 'preview/archive%d.html' % i)
          pathlib.Path('preview/preview-index.txt').write_text('\n'.join(hits[:10]), encoding='utf-8')
          print('visual previews:', len(hits))
          PY

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f preview ci-jekyll.log
          git commit -m "chore: preview build [skip ci]" || echo "no changes"
          git push
