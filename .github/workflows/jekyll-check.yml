name: Jekyll Check

# تشخيصي مؤقّت: يبني الموقع بـJekyll (نسخة GitHub Pages نفسها) ويكتب سجل
# البناء في ملف داخل المستودع، لأن سجلات Actions لا تُقرأ بلا توثيق.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    if: contains(github.event.head_commit.message, '[ci-log]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install github-pages gem
        run: gem install github-pages -v 232 --no-document

      - name: Build with Jekyll (capture log)
        env:
          JEKYLL_ENV: production
        run: |
          # GitHub Pages ignores the site Gemfile and uses its own bundle,
          # so drop the local one to reproduce the Pages build faithfully.
          rm -f Gemfile Gemfile.lock
          set +e
          jekyll build --trace > /tmp/jekyll.log 2>&1
          code=$?
          echo "exit_code=$code" >> /tmp/jekyll.log
          tail -c 30000 /tmp/jekyll.log > ci-jekyll.log
          echo "----- log -----"
          cat ci-jekyll.log
          exit 0

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-jekyll.log
          git commit -m "chore: jekyll build log [skip ci]" || echo "no changes"
          git push
